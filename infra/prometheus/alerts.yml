groups:
  # ── Trading Safety ───────────────────────────────────────────────────────────
  - name: trading_safety
    interval: 15s
    rules:
      - alert: KillSwitchActive
        expr: (cashguard_kill_switch_active{job="cashguard_api"} == 1) and on(job,instance) (cashguard_safety_state_read_ok{job="cashguard_api"} == 1)
        for: 0m
        labels:
          severity: critical
          team: trading
        annotations:
          summary: "Saved global kill switch is active"
          description: "The saved global kill switch is active. Check the operator view; this does not confirm positions are flat or cancellations complete."

      - alert: VenueKillSwitchActive
        expr: (cashguard_venue_kill_switch_active{job="cashguard_api"} == 1) and on(job,instance) (cashguard_safety_state_read_ok{job="cashguard_api"} == 1)
        for: 0m
        labels:
          severity: critical
          team: trading
        annotations:
          summary: "Saved venue kill switch is active"
          description: "The saved {{ $labels.venue }} kill switch is active. This is venue state, not the global switch or proof that positions are flat."

      - alert: KillSwitchActivated
        expr: (cashguard_kill_switch_last_activation_timestamp_seconds{job="cashguard_api"} > time() - 300) and (cashguard_kill_switch_last_activation_timestamp_seconds{job="cashguard_api"} <= time()) and on(job,instance) (cashguard_safety_state_read_ok{job="cashguard_api"} == 1)
        for: 0m
        labels:
          severity: critical
          team: trading
        annotations:
          summary: "Recent recorded global kill-switch activation"
          description: "The most recent retained global activation occurred within five minutes. This is historical evidence, not current halt state or an activation count. Resolution does not mean trading resumed."

      - alert: SafetyStateReadUnavailable
        expr: (up{job="cashguard_api"} == 1) unless on(job,instance) (cashguard_safety_state_read_ok{job="cashguard_api"} == 1)
        for: 1m
        labels:
          severity: warning
          team: ops
        annotations:
          summary: "Saved safety state is unavailable"
          description: "The API scrape succeeded but the saved safety-state read failed or its readiness marker is missing. Inspect database access and read limits. Unknown does not mean safe or enabled."

      - alert: SafetyControlUnknown
        expr: (cashguard_safety_state_known{job="cashguard_api"} == 0) and on(job,instance) (cashguard_safety_state_read_ok{job="cashguard_api"} == 1) and on(job,instance) (up{job="cashguard_api"} == 1)
        for: 1m
        labels:
          severity: warning
          team: ops
        annotations:
          summary: "Saved safety control is unknown"
          description: "Saved {{ $labels.control }} for {{ $labels.scope }} is unavailable. A venue may be intentionally unconfigured; check the deployment runbook. Do not enable a venue or change defaults to clear this warning."

      - alert: CircuitBreakerOpen
        expr: cashguard_circuit_breaker_open == 1
        for: 30s
        labels:
          severity: critical
          team: trading
        annotations:
          summary: "Broker circuit breaker is OPEN"
          description: "The broker circuit breaker has opened after repeated failures. Orders cannot be placed. Broker: {{ $labels.broker }}."

      - alert: AutoTradingDisabled
        expr: (cashguard_auto_trading_enabled{job="cashguard_api"} == 0) and on(job,instance) (cashguard_safety_state_known{job="cashguard_api",control="auto_trading",scope="global"} == 1) and on(job,instance) (cashguard_safety_state_read_ok{job="cashguard_api"} == 1)
        for: 5m
        labels:
          severity: warning
          team: trading
        annotations:
          summary: "Auto trading has been disabled for >5 minutes"
          description: "Auto trading has been off for more than 5 minutes. This may be intentional or a configuration issue."

      - alert: HighRiskViolationRate
        expr: rate(cashguard_risk_violations_total[5m]) > 0.5
        for: 2m
        labels:
          severity: warning
          team: trading
        annotations:
          summary: "High risk violation rate"
          description: "More than 0.5 risk violations/second over the last 5 minutes. Violation type: {{ $labels.violation_type }}. This may indicate strategy misconfiguration."

      - alert: HighCashGuardBlockRate
        expr: rate(cashguard_cash_guard_blocks_total[5m]) > 0.2
        for: 1m
        labels:
          severity: warning
          team: trading
        annotations:
          summary: "Cash guard blocking orders frequently"
          description: "Cash guard is blocking orders at >0.2/second. Available cash may be critically low."

  # Account cash/value/position metrics have no authoritative producer.
  # LowAvailableCash (<100) and HighOpenPositions (>8) are not active coverage;
  # see docs/operations/monitoring-alert-truth.md before restoring those rules.

  # ── Worker Reliability ───────────────────────────────────────────────────
  - name: worker_reliability
    interval: 30s
    rules:
      - alert: CashGuardTaskFailureSpiking
        expr: rate(cashguard_task_failures_total[5m]) * 300 > 2
        for: 0m
        labels:
          severity: warning
          team: ops
        annotations:
          summary: "Celery task failures are elevated"
          description: "More than 2 tasks have exhausted all retries and landed in the dead-letter queue in the last 5 minutes. Task: {{ $labels.task_name }}."

      - alert: CashGuardTaskFailuresCritical
        expr: rate(cashguard_task_failures_total[5m]) * 300 > 5
        for: 0m
        labels:
          severity: critical
          team: ops
        annotations:
          summary: "Celery task failures are critical"
          description: "More than 5 tasks have exhausted all retries and landed in the dead-letter queue in the last 5 minutes. Task: {{ $labels.task_name }}. Investigate dead-letter queue immediately."

  # ── API Health ───────────────────────────────────────────────────────────────
  - name: api_health
    interval: 15s
    rules:
      - alert: BrokerRequestLatencyHigh
        expr: histogram_quantile(0.95, rate(cashguard_broker_request_duration_seconds_bucket[5m])) > 5
        for: 2m
        labels:
          severity: warning
          team: ops
        annotations:
          summary: "Broker API p95 latency above 5s"
          description: "The 95th percentile broker request duration is {{ $value | humanizeDuration }}. Orders may be delayed."

      - alert: BrokerRequestLatencyCritical
        expr: histogram_quantile(0.99, rate(cashguard_broker_request_duration_seconds_bucket[5m])) > 15
        for: 1m
        labels:
          severity: critical
          team: ops
        annotations:
          summary: "Broker API p99 latency above 15s"
          description: "The 99th percentile broker request duration is {{ $value | humanizeDuration }}. The broker may be down."

      - alert: APIDown
        expr: up{job="cashguard_api"} == 0
        for: 1m
        labels:
          severity: critical
          team: ops
        annotations:
          summary: "CashGuard API is unreachable"
          description: "Prometheus cannot scrape the CashGuard API /metrics endpoint. The service may be down."

      - alert: PostgresDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
          team: ops
        annotations:
          summary: "Postgres exporter is down"
          description: "Cannot reach the Postgres exporter. Database may be unavailable."

      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
          team: ops
        annotations:
          summary: "Redis exporter is down"
          description: "Cannot reach the Redis exporter. Cache/queue layer may be unavailable."
